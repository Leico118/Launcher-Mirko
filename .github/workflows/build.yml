name: Build LauncherMirko

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompresser la derniere version
        run: |
          ZIP=$(ls LauncherMirko-*.zip | sort -V | tail -1)
          echo "Zip utilise : $ZIP"
          mkdir src && unzip -q "$ZIP" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler l'APK
        run: gradle -p src assembleRelease --no-daemon
      - name: Renommer l'APK
        run: |
          VERSION=$(grep versionName src/app/build.gradle | sed "s/.*'\(.*\)'.*/\1/")
          cp src/app/build/outputs/apk/release/app-release.apk LauncherMirko-$VERSION.apk
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: LauncherMirko-${{ env.VERSION }}
          path: LauncherMirko-*.apk
